# fly.toml app configuration file generated for accidentescarabineros on 2026-10-12T23:30:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'accidentescarabineros'
primary_region = 'gru'

[build]

[deploy]
  release_command = 'node dist/server.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
