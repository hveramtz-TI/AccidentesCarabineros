# fly.toml app configuration file generated for backend-dawn-meadowland-5739 on 2026-10-19T11:20:33-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-dawn-meadowland-5739'
primary_region = 'gru'
kill_signal = 'SIGTERM'
kill_timeout = 30

[build]
  dockerfile = 'backend/Dockerfile'
  ignorefile = '.dockerignore'

[deploy]
  release_command = './node_modules/.bin/prisma migrate deploy'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    method = 'get'
    path = '/health'
    interval = '15s'
    timeout = '5s'
    # Headroom for cold start; migrations run in the release command before
    # the machine boots.
    grace_period = '60s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
